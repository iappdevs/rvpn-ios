name: TestFlight Upload

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build-and-upload:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # ── Build the Rust engine for iOS ─────────────────────────────
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          rustup target add aarch64-apple-ios

      - name: Build Rust engine
        run: |
          cd rVPN-core/rvpn
          cargo build --release --target aarch64-apple-ios \
            -p rvpn-mobile --no-default-features --features ios-direct-tun

      # ── Build the Swift app for iOS ────────────────────────────────
      - name: Build Swift app
        run: |
          cd rvpn-ios-app
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          swift build -c release \
            -Xswiftc -sdk -Xswiftc "$SDK" \
            -Xswiftc -target -Xswiftc arm64-apple-ios17.0 \
            -Xcc -isysroot -Xcc "$SDK"

      # ── Package as .app + .ipa ─────────────────────────────────────
      - name: Package .ipa
        run: |
          # Copy static library
          mkdir -p rvpn-ios-app/Sources/rvpn-ios-app/Libs
          cp rVPN-core/rvpn/target/aarch64-apple-ios/release/librvpn_mobile.a \
             rvpn-ios-app/Sources/rvpn-ios-app/Libs/

          # Create .app bundle
          APP_DIR="build/RVPN.app"
          mkdir -p "$APP_DIR/META-INF"
          cp rvpn-ios-app/.build/release/rvpn-ios-app "$APP_DIR/RVPN"

          # Info.plist
          cat > "$APP_DIR/Info.plist" << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key><string>RVPN</string>
              <key>CFBundleIdentifier</key><string>org.rvpn.ios</string>
              <key>CFBundleName</key><string>R-VPN</string>
              <key>CFBundleDisplayName</key><string>R-VPN</string>
              <key>CFBundleVersion</key><string>1</string>
              <key>CFBundleShortVersionString</key><string>0.1.0</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>MinimumOSVersion</key><string>17.0</string>
              <key>UIRequiredDeviceCapabilities</key><array><string>arm64</string></array>
          </dict>
          </plist>
          PLIST

          # Package as .ipa
          mkdir -p build/Payload
          cp -r "$APP_DIR" build/Payload/
          cd build && zip -r RVPN.ipa Payload/ && cd ..

          echo "=== Build outputs ==="
          ls -la build/*.ipa

      # ── Set up App Store Connect API key ──────────────────────────
      - name: Setup ASC API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          mkdir -p ~/private_keys
          echo "$APPLE_API_KEY_P8" > ~/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8
          ls -la ~/private_keys/

      # ── Upload to TestFlight ───────────────────────────────────────
      - name: Upload to TestFlight
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file build/RVPN.ipa \
            --apiKey "$APPLE_API_KEY_ID" \
            --apiIssuer "$APPLE_API_ISSUER" 2>&1 || {
              echo "--- altool may be deprecated, trying iTMSTransporter ---"
              xcrun iTMSTransporter -m upload \
                -assetFile build/RVPN.ipa \
                -apiKey "$APPLE_API_KEY_ID" \
                -apiIssuer "$APPLE_API_ISSUER" 2>&1 || {
                  echo "--- trying notarytool ---"
                  xcrun notarytool submit build/RVPN.ipa \
                    --key ~/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8 \
                    --key-id "$APPLE_API_KEY_ID" \
                    --issuer "$APPLE_API_ISSUER" \
                    --wait 2>&1 || {
                    echo "ERROR: All upload methods failed"
                    exit 1
                  }
              }
            }

      - name: Upload artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: rvpn-ipa
          path: build/RVPN.ipa
          if-no-files-found: error
