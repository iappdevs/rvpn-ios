name: Bisect P12
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build-and-upload:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test p12 secrets
        env:
          P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
        run: |
          echo "p12 b64 length: ${#P12_BASE64}"
          echo "pass length: ${#P12_PASSWORD}"
