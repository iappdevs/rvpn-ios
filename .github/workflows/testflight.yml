name: TestFlight Upload

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-and-upload:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          rustup target add aarch64-apple-ios

      - name: Build Rust engine
        run: |
          cd rVPN-core/rvpn
          cargo build --release --target aarch64-apple-ios \
            -p rvpn-mobile --no-default-features --features ios-direct-tun

      - name: Install xtool
        run: |
          git clone --depth 1 https://github.com/xtool-org/xtool.git /tmp/xtool-src
          cd /tmp/xtool-src
          swift build -c release 2>&1 | tail -5
          sudo cp .build/release/xtool /usr/local/bin/xtool
          xtool --version

      - name: Setup iOS SDK
        run: |
          # On macOS, use the installed Xcode's SDK
          xcrun --sdk iphoneos --show-sdk-path

      - name: Build iOS app with xtool
        run: |
          mkdir -p rvpn-ios-app/Sources/rvpn-ios-app/Libs
          cp rVPN-core/rvpn/target/aarch64-apple-ios/release/librvpn_mobile.a \
             rvpn-ios-app/Sources/rvpn-ios-app/Libs/

          cd rvpn-ios-app
          xtool build 2>&1 | tail -20 || {
            echo "xtool build failed, trying swift build with destination..."
            cat > destination.json << 'DEST'
          {
            "version": 1,
            "sdk": "$(xcrun --sdk iphoneos --show-sdk-path)",
            "target": "arm64-apple-ios17.0"
          }
          DEST
            swift build --destination destination.json -c release 2>&1 | tail -20
          }

      - name: Package .ipa
        run: |
          APP_DIR="build/RVPN.app"
          mkdir -p "$APP_DIR"

          # Find the built binary
          BINARY=$(find rvpn-ios-app/.build -name "rvpn-ios-app" -type f | head -1)
          if [ -z "$BINARY" ]; then
            BINARY=$(find rvpn-ios-app/.build -name "RVPN" -type f | head -1)
          fi
          echo "Binary: $BINARY"
          cp "$BINARY" "$APP_DIR/RVPN"

          cat > "$APP_DIR/Info.plist" << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key><string>RVPN</string>
              <key>CFBundleIdentifier</key><string>org.rvpn.ios</string>
              <key>CFBundleName</key><string>R-VPN</string>
              <key>CFBundleDisplayName</key><string>R-VPN</string>
              <key>CFBundleVersion</key><string>1</string>
              <key>CFBundleShortVersionString</key><string>0.1.0</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>MinimumOSVersion</key><string>17.0</string>
          </dict>
          </plist>
          PLIST

          mkdir -p build/Payload
          cp -r "$APP_DIR" build/Payload/
          cd build && zip -r RVPN.ipa Payload/ && cd ..
          ls -la build/*.ipa

      - name: Setup ASC API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          echo "$APPLE_API_KEY_P8" > ~/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8

      - name: Upload to TestFlight
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file build/RVPN.ipa \
            --apiKey "$APPLE_API_KEY_ID" \
            --apiIssuer "$APPLE_API_ISSUER"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rvpn-ipa
          path: build/RVPN.ipa
          if-no-files-found: error
