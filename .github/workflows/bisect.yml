name: Bisect AsciiBig
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build-and-upload:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test renamed secret
        env:
          P12_BASE64: ${{ secrets.TEST_ASCII_BIG }}
        run: |
          echo "p12 b64 length: ${#P12_BASE64}"
