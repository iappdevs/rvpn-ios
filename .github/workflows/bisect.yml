name: Bisect PwOnly
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build-and-upload:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test password only
        env:
          P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
        run: |
          echo "pass length: ${#P12_PASSWORD}"
