name: TestFlight Upload

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-and-upload:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Rust engine
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          rustup target add aarch64-apple-ios
          cd rVPN-core/rvpn
          cargo build --release --target aarch64-apple-ios \
            -p rvpn-mobile --no-default-features --features ios-direct-tun

      - name: Compile Swift app
        run: |
          mkdir -p build
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          swiftc \
            -target arm64-apple-ios17.0 \
            -sdk "$SDK" \
            -parse-as-library \
            -emit-executable \
            -framework SwiftUI \
            -o build/RVPN \
            rvpn-ios-app/Sources/rvpn-ios-app/*.swift
          echo "=== Binary ==="
          file build/RVPN
          ls -la build/RVPN

      - name: Package .ipa
        run: |
          APP_DIR="build/RVPN.app"
          mkdir -p "$APP_DIR"
          cp build/RVPN "$APP_DIR/"
          cat > "$APP_DIR/Info.plist" << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key><string>RVPN</string>
              <key>CFBundleIdentifier</key><string>org.rvpn.ios</string>
              <key>CFBundleName</key><string>R-VPN</string>
              <key>CFBundleDisplayName</key><string>R-VPN</string>
              <key>CFBundleVersion</key><string>1</string>
              <key>CFBundleShortVersionString</key><string>0.1.0</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>MinimumOSVersion</key><string>17.0</string>
          </dict>
          </plist>
          PLIST

          mkdir -p build/Payload
          cp -r "$APP_DIR" build/Payload/
          cd build && zip -r RVPN.ipa Payload/ && cd ..
          echo "=== IPA ==="
          ls -la build/*.ipa

      - name: Setup ASC API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          echo "$APPLE_API_KEY_P8" > ~/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8

      - name: Upload to TestFlight
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file build/RVPN.ipa \
            --apiKey "$APPLE_API_KEY_ID" \
            --apiIssuer "$APPLE_API_ISSUER"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rvpn-ipa
          path: build/RVPN.ipa
          if-no-files-found: error
