name: RVPTunnelGen
options:
  bundleIdPrefix: org.rvpn
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""

targets:
  RVPN Tunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/rvpn-tunnel-provider
      - path: Sources/rvpn-ios-app/TunnelStatistics.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.rvpn.ios.tunnel
        PRODUCT_NAME: RVPN Tunnel
        TARGETED_DEVICE_FAMILY: "1"
        OTHER_LDFLAGS: >-
          -L$(SRCROOT)/Sources/rvpn-ios-app/Libs
          -lrvpn_mobile
          -lc++
    info:
      path: GeneratedTunnelInfo.plist
      properties:
        CFBundleDisplayName: RVPN Tunnel
        CFBundleShortVersionString: "0.1.0"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).RVPNTunnelProvider
