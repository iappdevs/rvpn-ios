name: Build iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          rustup target add aarch64-apple-ios

      - name: Build Rust engine for iOS
        run: |
          cd rVPN-core/rvn
          cargo build --release --target aarch64-apple-ios \
            -p rvpn-mobile --no-default-features --features ios-direct-tun

      - name: Copy static library into app
        run: |
          mkdir -p rvpn-ios-app/Sources/rvpn-ios-app/Libs
          cp rVPN-core/rvn/target/aarch64-apple-ios/release/librvpn_mobile.a \
             rvpn-ios-app/Sources/rvpn-ios-app/Libs/

      - name: Build Swift for iOS (arm64)
        run: |
          cd rvpn-ios-app
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          swift build -c release \
            -Xswiftc -sdk -Xswiftc "$SDK" \
            -Xswiftc -target -Xswiftc arm64-apple-ios17.0 \
            -Xcc -isysroot -Xcc "$SDK" \
            2>&1 | tail -20

      - name: Upload Rust library + Swift binary
        uses: actions/upload-artifact@v4
        with:
          name: rvpn-ios-parts
          path: |
            rVPN-core/rvn/target/aarch64-apple-ios/release/librvpn_mobile.a
            rvpn-ios-app/.build/release/rvpn-ios-app
          if-no-files-found: warn
          retention-days: 30
