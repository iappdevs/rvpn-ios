name: TestFlight Upload

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-and-upload:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          rustup target add aarch64-apple-ios

      - name: Build Rust engine
        run: |
          cd rVPN-core/rvpn
          cargo build --release --target aarch64-apple-ios \
            -p rvpn-mobile --no-default-features --features ios-direct-tun

      - name: Copy library
        run: |
          mkdir -p rvpn-ios-app/Sources/rvpn-ios-app/Libs
          cp rVPN-core/rvpn/target/aarch64-apple-ios/release/librvpn_mobile.a \
             rvpn-ios-app/Sources/rvpn-ios-app/Libs/

      - name: Build iOS app with xcodebuild
        run: |
          cd rvpn-ios-app
          set +e
          xcodebuild \
            -scheme rvpn-ios-app \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath build \
            build > build.log 2>&1
          STATUS=$?
          set -e
          if [ $STATUS -ne 0 ]; then
            echo "=== Swift errors ==="
            grep -B1 -A3 "error:" build.log | head -60
            echo "=== tail ==="
            tail -15 build.log
            exit $STATUS
          fi
          tail -5 build.log

      - name: Set up code signing
        env:
          P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APPLE_MOBILEPROVISION }}
        run: |
          KEYCHAIN_PASSWORD=tempkeychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain-db
          security default-keychain -s build.keychain-db
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain-db
          security set-keychain-settings -t 3600 -u build.keychain-db
          echo "$P12_BASE64" | base64 -d > cert.p12
          security import cert.p12 -k build.keychain-db -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain-db
          security list-keychain -d user -s build.keychain-db
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_BASE64" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/rvpn.mobileprovision
          echo "--- identities ---"
          security find-identity -v -p codesigning build.keychain-db

      - name: Package and sign .ipa
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          rm -rf build
          APP_DIR="build/RVPN.app"
          mkdir -p "$APP_DIR"

          BINARY=$(find rvpn-ios-app/build rvpn-ios-app/.build -name "rvpn-ios-app" -type f 2>/dev/null | head -1)
          if [ -z "$BINARY" ]; then echo "ERROR: No binary found"; exit 1; fi
          echo "Found: $BINARY"
          cp "$BINARY" "$APP_DIR/RVPN"

          # Compile asset catalog (app icon) with actool
          mkdir -p build/ac
          xcrun actool --compile build/ac \
            --minimum-deployment-target 17.0 \
            --platform iphoneos \
            --target-device iphone --target-device ipad \
            --app-icon AppIcon \
            --output-partial-info-plist build/ac_info.plist \
            rvpn-ios-app/Assets.xcassets > actool.log 2>&1 || cat actool.log
          if [ -f build/ac/Assets.car ]; then
            cp build/ac/Assets.car "$APP_DIR/Assets.car"
            echo "Assets.car: $(ls -la build/ac/Assets.car)"
          else
            echo "WARNING: no Assets.car produced — actool.log follows"
            cat actool.log
          fi

          # SDK build metadata Apple's validator requires (Xcode injects these
          # automatically; manual .app assembly has to add them itself).
          SDK_VERSION=$(xcrun --sdk iphoneos --show-sdk-version)
          SDK_BUILD=$(xcrun --sdk iphoneos --show-sdk-build-version)
          XCODE_VERSION=$(xcodebuild -version | awk 'NR==1{print $2}')
          XCODE_BUILD=$(xcodebuild -version | awk 'NR==2{print $3}')
          DTXCODE=$(echo "$XCODE_VERSION" | awk -F. '{printf "%d%02d", $1, $2}')

          cat > "$APP_DIR/Info.plist" << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key><string>RVPN</string>
              <key>CFBundleIdentifier</key><string>org.rvpn.ios</string>
              <key>CFBundleName</key><string>R-VPN</string>
              <key>CFBundleDisplayName</key><string>R-VPN</string>
              <key>CFBundleVersion</key><string>${BUILD_NUMBER}</string>
              <key>CFBundleShortVersionString</key><string>0.1.0</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
              <key>CFBundleDevelopmentRegion</key><string>en</string>
              <key>CFBundleIconName</key><string>AppIcon</string>
              <key>MinimumOSVersion</key><string>17.0</string>
              <key>LSRequiresIPhoneOS</key><true/>
              <key>UIDeviceFamily</key><array><integer>1</integer><integer>2</integer></array>
              <key>UISupportedInterfaceOrientations</key><array><string>UIInterfaceOrientationPortrait</string></array>
              <key>UILaunchScreen</key><dict/>
              <key>ITSAppUsesNonExemptEncryption</key><false/>
              <key>DTPlatformName</key><string>iphoneos</string>
              <key>DTPlatformVersion</key><string>${SDK_VERSION}</string>
              <key>DTPlatformBuild</key><string>${SDK_BUILD}</string>
              <key>DTSDKName</key><string>iphoneos${SDK_VERSION}</string>
              <key>DTSDKBuild</key><string>${SDK_BUILD}</string>
              <key>DTXcode</key><string>${DTXCODE}</string>
              <key>DTXcodeBuild</key><string>${XCODE_BUILD}</string>
              <key>BuildMachineOSBuild</key><string>24C101</string>
          </dict>
          </plist>
          PLIST

          cp ~/Library/MobileDevice/Provisioning\ Profiles/rvpn.mobileprovision \
             "$APP_DIR/embedded.mobileprovision"
          printf 'APPL????' > "$APP_DIR/PkgInfo"

          cat > entitlements.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>application-identifier</key><string>${APPLE_TEAM_ID}.org.rvpn.ios</string>
              <key>beta-reports-active</key><true/>
              <key>com.apple.developer.team-identifier</key><string>${APPLE_TEAM_ID}</string>
          </dict>
          </plist>
          PLIST

          codesign --force --identifier org.rvpn.ios \
            --sign "Apple Distribution" \
            --entitlements entitlements.plist \
            --timestamp "$APP_DIR"
          codesign --verify --verbose=2 "$APP_DIR"
          echo "SIGNATURE OK"

          mkdir -p build/Payload
          cp -r "$APP_DIR" build/Payload/
          cd build && zip -qr RVPN.ipa Payload/ && cd ..
          ls -la build/*.ipa

      - name: Setup ASC API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          echo "$APPLE_API_KEY_P8" > ~/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8

      - name: Upload to TestFlight
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file build/RVPN.ipa \
            --apiKey "$APPLE_API_KEY_ID" \
            --apiIssuer "$APPLE_API_ISSUER"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rvpn-ipa
          path: build/RVPN.ipa
          if-no-files-found: error
