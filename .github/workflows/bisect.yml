name: Bisect P12v2
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build-and-upload:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test p12 retry
        env:
          P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12 }}
        run: |
          echo "p12 b64 length: ${#P12_BASE64}"
