name: Bisect TeamID
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build-and-upload:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test team id
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "team id length: ${#APPLE_TEAM_ID}"
