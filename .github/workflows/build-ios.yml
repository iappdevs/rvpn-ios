name: Build iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test macOS runner
        run: |
          echo "macOS runner working!"
          swift --version
          uname -a

  build:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source "$HOME/.cargo/env"
          rustup target add aarch64-apple-ios
          rustc --version

      - name: Build Rust engine
        run: |
          source "$HOME/.cargo/env"
          cd rVPN-core/rvpn
          cargo build --release --target aarch64-apple-ios -p rvpn-mobile --no-default-features --features ios-direct-tun

      - name: Copy static library
        run: |
          mkdir -p rvpn-ios-app/Sources/rvpn-ios-app/Libs
          cp rVPN-core/rvpn/target/aarch64-apple-ios/release/librvpn_mobile.a \
             rvpn-ios-app/Sources/rvpn-ios-app/Libs/

      - name: Build Swift app
        run: |
          cd rvpn-ios-app
          swift build -c release 2>&1 || echo "Swift build needs iOS SDK - this is expected"

      - name: Upload Rust library
        uses: actions/upload-artifact@v4
        with:
          name: librvpn-mobile-ios
          path: rVPN-core/rvpn/target/aarch64-apple-ios/release/librvpn_mobile.a
